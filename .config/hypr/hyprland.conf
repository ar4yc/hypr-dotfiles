# ██ ██ █▀█ █▄ █ ▀ ▀█▀ █▀█ █▀█
# █ ▀ █ █▄█ █ ▀█ █  █  █▄█ █▀▅

monitor=,1920x1080@60,0x0,1

# █   ▄▀█ █ █ █▄ █ █▀▀ █ █
# █▄▄ █▀█ █▅█ █ ▀█ █▅▅ █▀█

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = waybar
exec-once = waypaper --restore
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swaync
exec-once = XDG_CURRENT_DESKTOP=gnome 64gram-desktop -startintray
exec-once = steam -silent
exec-once = easyeffects --hide-window --service-mode
exec-once = bash -c 'XDG_MENU_PREFIX=arch- kbuildsycoca6'
exec-once = ~/.config/hypr/scripts/vmware-passtrouth.sh

# █ █ ▄▀█ █▀█ ▀ ▄▀█ █▂▂ █   ▅▀▀▀▄
# ▀▅▀ █▀█ █▀▅ █ █▀█ █▂█ █▄▄ ▀▄▂▔

# Apps
$Terminal = kitty
$FileMG = dolphin
$Menu = wofi --show drun
$Browser = zen-browser

# Appearance
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_SCALE_FACTOR,1

# Cursor
env = HYPRCURSOR_THEME,Moga-Candy-Macchiato
env = XCURSOR_THEME,Moga-Candy-Macchiato
env = XCURSOR_SIZE,18
env = HYPRCURSOR_SIZE,18

# IMPORTANT
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

# Problem Fix
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_ENABLE_WAYLAND,1
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1

# Hardware
env = NVD_BACKEND,direct
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GL_VRR_ALLOWED,1

# █ █ ▀ █▔▔ █ █ ▄▀█ █
# ▀▅▀ █ ▂▂█ █▂█ █▀█ █▄▄

general {
    gaps_in = 3
    gaps_out = 4,17,10,17

    border_size = 2
    col.active_border = rgba(44,45,56,0.8)
    col.inactive_border = rgba(46,48,48,0)
    resize_on_border = true

    no_focus_fallback = true

    allow_tearing = false
    layout = dwindle
    hover_icon_on_border = true
}

decoration {
    rounding = 17
    rounding_power = 2

    active_opacity = 0.95
    inactive_opacity = 0.89
    

    blur {
        enabled = true

        size = 7
        passes = 4
        vibrancy = 0.743
        noise = 0.02
        contrast = 0.93

        popups = true
        popups_ignorealpha = 0.6

        xray = true
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 20
        offset = 0 2
        render_power = 10
        color = rgba(00000020)
    }
}

animations {
    enabled = true

    bezier = fast, 0.2, 1, 0.4, 1
    bezier = smooth, 0.05, 0.9, 0.1, 1.04
    
    #smooth
    #animation = windowsIn, 1, 6, smooth
    #animation = windowsOut, 1, 6.7, smooth, popin 80%
    #animation = windowsMove, 1, 4.9, smooth
    #animation = fade, 1, 7, default
    #animation = layersIn, 1, 3, smooth
    #animation = layersOut, 1, 4, smooth
    #animation = workspaces, 1, 6.7, smooth, slide
    #animation = border, 1, 6, smooth
    #animation = borderangle, 1, 8, default

    #fast
    animation = windowsIn, 1, 3, fast, gnomed
    animation = windowsOut, 1, 2.7, fast, slide down
    animation = windowsMove, 1, 2.7, fast
    animation = layersIn, 1, 3, fast
    animation = layersOut, 1, 4, fast
    animation = workspaces, 1,2.4, fast, slidefade
    animation = border, 1, 3.4, fast
}

# ██ ██ ▀ █▔▔ █▀▀
# █ ▀ █ █ ▂▂█ █▅▅

group {
    groupbar {
        enabled = yes

        font_family = JetBrains Mono
        font_size = 11
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    
    vrr = 0
    render_unfocused_fps = 48
    enable_swallow = false
    always_follow_on_dnd = 0
}

binds {
    scroll_event_delay = 0
    hide_special_on_workspace_change = true
}

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true

    enforce_permissions = false
}

# █ █▄ █ █▀█ █ █ ▀█▀
# █ █ ▀█ █▀▀ █▅█  █

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle, grp:shift_alt_toggle
    repeat_rate = 50
    repeat_delay = 200
    
    follow_mouse = 1
    sensitivity = -0.83
    accel_profile = flat
    off_window_axis_events = 2

    touchpad {
        natural_scroll = no
    }
}

device {
    name = mouse
    drag_lock = false
}

cursor {
    no_warps = true
    no_hardware_cursors = false
    no_break_fs_vrr = 1
}

# █▃▀ ▅▀▀▀▄ █ █ █▂▂ ▀ █▄ █ █▀▄ █▔▔
# █▀▄ ▀▄▂▔   █  █▂█ █ █ ▀█ █▃▀ ▂▂█ 

# Programs
bind = SUPER, W, exec, $Terminal 
bind = SUPER, E, exec, $FileMG
bind = SUPER, Z, exec, $Browser
bind = SUPER, R, exec, $Menu

# Control
bind = SUPER, F, fullscreen
bind = SUPER, S, togglefloating
bind = SUPER, A, layoutmsg, togglesplit
bind = SUPER, Q, killactive
bind = SUPER, DELETE, exit

# Other Binds
bind = SUPER SHIFT, S, exec, flameshot gui            # Screenshot
bind = SUPER, I, exec, waypaper                       # Wallapers
bind = CTRL ALT, A, exec, hyprpicker --autocopy       # Color Picke1r
bind = SUPER, V, exec, cliphist list | wofi -dmenu| cliphist decode | wl-copy && wtype -M ctrl -P v -m ctrl
bind = CTRL SHIFT, ESCAPE, exec, missioncenter
bind = ALT, D, exec, dialect
bind = CTRL ALT, F, exec, mousam
bind = CTRL ALT, S, pin

# Audio control
bindl = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Focus change
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Swap workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Swap workspace using mouse
bind = SUPER, mouse_up, workspace, e+1
bind = SUPER, mouse_down, workspace, e-1

# Move window on workspace
bind = SUPER SHIFT, mouse_up, movetoworkspace, e+1
bind = SUPER SHIFT, mouse_down, movetoworkspace, e-1

# Move windows on other workspaces
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Move windows | Change size
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse:272, exec, hyprctl keyword dwindle:smart_split 1
bindr = SUPER, mouse:272, exec, hyprctl keyword dwindle:smart_split 0

# Source
source = ~/.config/hypr/windowrule.conf
