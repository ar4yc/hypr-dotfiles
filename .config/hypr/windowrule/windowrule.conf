windowrule {
   name = dolphin
   match:class = org.kde.dolphin
   match:title = .*/.*
   min_size = 1060 548
}

windowrule {
   name = dolphin-Properties
   match:class = org.kde.dolphin
   match:initial_title = .*Properties.*|.*Choose Application.*
   float = yes
   center = yes
}

windowrule {
   name = copymove-dolphin
   match:class = org.kde.dolphin
   match:title = .*(Cop|Mov|Progress).*
   float = yes
}

windowrule {
   name = create-dolphin
   match:class = org.kde.dolphin
   match:title = .*(File Already Exists|Progress Dialog|Creating directory).*
   float = yes
   center = yes
   size = window_w window_h
}

windowrule {
   name = steam
   match:class = steam
   match:initial_title = Steam
   tile = yes
   min_size = 1099 898
}

windowrule {
   name = steam-dropwindow
   match:class = steam
   match:title = negative:Steam|()
   float = yes
   center = yes
   size = 920 571
   stay_focused = no
}

windowrule {
   name = steam-context-menu
   match:class = steam
   match:initial_title = ^$
   float = yes
   stay_focused = yes
   #no_blur = yes
   min_size = window_w window_h
}

windowrule {
   name = steam-settings
   match:class = steam
   match:title = .*(Настройки|.*Settings).*
   float = yes
   center = yes
   size = 840 717
   stay_focused = no
}

windowrule {
   name = steam-friends
   match:class = steam
   match:title = .*(Список друзей|.*Friends List).*
   float = yes
   center = yes
   size = 925 591
   stay_focused = no
}

windowrule {
   name = steam-notification
   match:class = steam
   match:initial_title = .*notif.*
   float = yes
   center = no
   no_focus = yes
   no_blur = yes
}

windowrule {
   name = steam-other
   match:class = steam
   match:initial_title = .*(Завершение работы|Shutdown|Войти|Sign|Запуск...|Launch...|О Steam|About steam|окно|Dialog).*
   float = yes
   center = yes
   size = window_w window_h
   stay_focused = no
}

windowrule {
   name = steam-add-games
   match:class = steam
   match:initial_title = .*(Добавить стороннюю игру|Add Non-Steam Game).*
   float = yes
   center = yes
   size = 900 790
   stay_focused = no
}

windowrule {
   name = steam-games
   match:class = .*steam_app.*
   float = yes
   tile = no
   center = yes
   no_blur = true
   opaque = yes
   stay_focused = no
}

windowrule {
   name = steam-games_menu
   match:class = .*steam_app.*
   match:initial_title = ()
   float = yes
   center = yes
   stay_focused = no
}

windowrule {
   name = ark
   match:class = org.kde.ark
   float = no
}

windowrule {
   name = extract_ark
   match:class = org.kde.ark
   match:initial_title = .*Extract.*
   float = yes
   center = yes
   size = 1241 826
}

windowrule {
   name = extract_prochess_ark
   match:class = org.kde.ark
   match:initial_title = .*Extracting.*|.*Loading archive.*|.*File Already Exists.*
   float = yes
   center = yes
}

windowrule {
   name = flameshot
   match:class = flameshot
   float = yes
   size = monitor_w monitor_h
   move = 0 0
   opaque = yes
   rounding = 0
   border_size = 0
   no_blur = yes
   no_anim = yes
}

windowrule {
   name = flameshot-settings
   match:class = flameshot
   match:initial_title = .*(Настройки|Settings).*
   float = yes
   size = window_w window_h
   center = yes
   no_blur = no
   no_anim = no
   stay_focused = no
   pin = no
   border_size = 2
   rounding = 6
   opacity = 1
}

windowrule {
   name = flameshot-save
   match:class = flameshot
   match:title = .*(Сохранить|Save).*
   float = yes
   center = yes
   size = 1044 761
   no_blur = no
   no_anim = no
   stay_focused = no
   pin = no
   border_size = 2
   rounding = 6
   opacity = 1
}

windowrule {
   name = qBittorrent_all
   match:class = org.qbittorrent.qBittorrent
   float = yes
   center = yes
}

windowrule {
   name = qBittorrent
   match:class = org.qbittorrent.qBittorrent
   match:title = .*qBittorrent v.*
   float = no
}

windowrule {
   name = notile-class
   match:class = (?i).*(file_progress|confirm|dialog|download|notification|error|splash|org.kde.kdialog|wizard|assistant|auth|permission).*
   float = yes
   center = yes
}

windowrule {
   name = notile-title
   match:title = (?i).*(Open Files|Save File|Choose Files|Please choose a file).*
   float = yes
   center = yes
   size = window_w window_h
   persistent_size = yes
}

# VMware
submap = passthrough
bind = SUPER, F, fullscreen, 0
bind = SUPER, F, submap, reset
submap = reset